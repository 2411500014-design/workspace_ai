name: purnara
description: "Purnara: AI project workspace that plans, tracks and re-plans big projects until they are done."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Flutter's Material library, now a standalone package (go_router 18 uses it too).
  material_ui: ^1.4.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  file_picker: ^13.1.0
  intl: any
  # Icon font for the Cupertino widgets that material_ui uses on iOS and macOS.
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # gen-l10n: Indonesian and English strings from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  assets:
    - assets/fonts/OFL.txt

  # Plus Jakarta Sans (SIL OFL 1.1, see assets/fonts/OFL.txt), bundled so the app works
  # offline and never contacts a font CDN.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
