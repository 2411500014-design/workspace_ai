<!DOCTYPE html>
<html lang="id">
<head>
  <!--
    $FLUTTER_BASE_HREF is replaced by the value of `flutter build web --base-href`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Purnara: workspace project berbasis AI untuk menyelesaikan skripsi, TA, dan penelitian tepat waktu.">
  <meta name="theme-color" content="#F6F8F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C1110" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Purnara">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon: vector first, PNG for browsers without SVG favicons. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Link previews (WhatsApp, Telegram, LinkedIn, X). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Purnara">
  <meta property="og:title" content="Purnara: selesaikan project besarmu, satu langkah sehari">
  <meta property="og:description" content="Rencana dari dokumenmu, fokus harian, dan jadwal yang menyesuaikan saat keadaan berubah. Untuk skripsi, TA, dan penelitian.">
  <meta property="og:image" content="icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo Purnara dan pratinjau layar Fokus hari ini">
  <meta property="og:locale" content="id_ID">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">

  <title>Purnara</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The first paint, while the Flutter bundle downloads. Colours match the app theme. */
    :root { --bg: #F6F8F7; --fg: #0F1B1A; --muted: #53625F; --accent: #0F766E; --track: #E2E8E6; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0C1110; --fg: #E8EEED; --muted: #9DABA8; --accent: #4FC7B5; --track: #243030; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #purnara-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--fg); transition: opacity 220ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    #purnara-loading img { width: 52px; height: 52px; display: block; }
    #purnara-loading .name { font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }
    #purnara-loading .bar { width: 112px; height: 3px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 6px; }
    #purnara-loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: var(--accent); border-radius: 3px;
      animation: purnara-slide 1.1s cubic-bezier(0.77, 0, 0.175, 1) infinite;
    }
    @keyframes purnara-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #purnara-loading .bar::after { animation: none; width: 100%; opacity: 0.5; } }
    #purnara-loading .hint { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="purnara-loading" role="status" aria-live="polite">
    <img src="favicon.svg" width="52" height="52" alt="" aria-hidden="true">
    <div class="name">Purnara</div>
    <div class="bar" aria-hidden="true"></div>
    <div class="hint">Memuat aplikasi… · Loading…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('purnara-loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 220);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
