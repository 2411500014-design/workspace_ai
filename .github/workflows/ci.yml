name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Flutter app (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version used locally (see README), so CI and the
      # developer machine agree on lints and formatting.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
